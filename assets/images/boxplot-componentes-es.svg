<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024" role="img" aria-labelledby="title desc" lang="es"><defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#143254" opacity=".06"/></pattern></defs><rect width="1536" height="1024" fill="#F7F4EC"/><rect width="1536" height="1024" fill="url(#grid)"/><style>text{font-family:Segoe UI,Arial,sans-serif;fill:#143254}.title{font-size:48px;font-weight:700}.sub{font-size:27px}.label{font-size:30px;font-weight:650}.small{font-size:26px}.line{stroke:#143254;stroke-width:4;fill:none}.guide{stroke:#62686D;stroke-width:2;fill:none}</style><title id="title">Cómo leer un boxplot</title><desc id="desc">Ejemplo esquemático. Q1 es 30, mediana 40 y Q3 50; el rango intercuartílico es 20. Los límites de referencia son 0 y 80. Los bigotes llegan a las observaciones 10 y 70. El punto 90 queda fuera del límite superior.</desc><text x="96" y="105" class="title">Cómo leer un boxplot</text><text x="96" y="155" class="sub">Diagrama de caja y bigotes · convención de 1,5 × RIC</text>
<text x="488" y="250" text-anchor="middle" class="label">Q1 · cuartil 1</text><text x="488" y="288" text-anchor="middle" class="small">Percentil 25</text><path d="M488 308V390" class="guide"/>
<text x="744" y="250" text-anchor="middle" class="label">Q3 · cuartil 3</text><text x="744" y="288" text-anchor="middle" class="small">Percentil 75</text><path d="M744 308V390" class="guide"/>
<path d="M232 470H1000 M232 430V510 M1000 430V510" class="line"/><rect x="488" y="390" width="256" height="160" fill="#DCE6F1" stroke="#143254" stroke-width="4"/><path d="M616 390V550" stroke="#1F497D" stroke-width="9"/>
<path d="M104 350V610 M1128 350V610" stroke="#62686D" stroke-width="2" stroke-dasharray="8 8"/>
<circle cx="1256" cy="470" r="13" fill="#FFFF33" stroke="#143254" stroke-width="4"/>
<text x="232" y="340" text-anchor="middle" class="label">Bigote inferior</text><path d="M232 355V420" class="guide"/>
<text x="1000" y="340" text-anchor="middle" class="label">Bigote superior</text><path d="M1000 355V420" class="guide"/>
<text x="1256" y="250" text-anchor="middle" class="label">Valor atípico</text><text x="1256" y="288" text-anchor="middle" class="small">Fuera de los límites</text><path d="M1256 308V447" class="guide"/>
<path d="M616 555V590" class="guide"/><text x="616" y="630" text-anchor="middle" class="label">Mediana · Q2 = 40 · percentil 50</text>
<path d="M488 670V692H744V670" class="line"/><text x="616" y="737" text-anchor="middle" class="label">RIC = Q3 − Q1 = 20</text><text x="616" y="776" text-anchor="middle" class="small">La caja abarca el 50 % central de los datos.</text>
<text x="104" y="660" text-anchor="middle" class="small">0</text><text x="232" y="585" text-anchor="middle" class="small">10</text><text x="488" y="585" text-anchor="middle" class="small">30</text><text x="744" y="585" text-anchor="middle" class="small">50</text><text x="1000" y="585" text-anchor="middle" class="small">70</text><text x="1128" y="660" text-anchor="middle" class="small">80</text><text x="1256" y="585" text-anchor="middle" class="small">90</text>
<rect x="80" y="820" width="1376" height="154" rx="12" fill="#FFFFFF" stroke="#C9CED3"/><text x="110" y="860" class="small">Límites de referencia: Q1 − 1,5 × RIC y Q3 + 1,5 × RIC (líneas discontinuas).</text><text x="110" y="902" class="small">Cada bigote llega al valor observado más extremo dentro de esos límites.</text><text x="110" y="944" class="small">Un valor atípico requiere revisión del contexto; puede ser una observación válida.</text></svg>