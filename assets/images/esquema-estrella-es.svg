<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024" role="img" aria-labelledby="title desc" lang="es"><defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#143254" opacity=".06"/></pattern></defs><rect width="1536" height="1024" fill="#F7F4EC"/><rect width="1536" height="1024" fill="url(#grid)"/><style>text{font-family:Segoe UI,Arial,sans-serif;fill:#143254}.title{font-size:48px;font-weight:700}.sub{font-size:27px}.label{font-size:30px;font-weight:650}.small{font-size:26px}.line{stroke:#143254;stroke-width:4;fill:none}.guide{stroke:#62686D;stroke-width:2;fill:none}</style><title id="title">Esquema estrella: hechos y dimensiones</title><desc id="desc">Una tabla central de líneas de venta se relaciona muchos a uno con las dimensiones fecha, cliente, producto y sucursal. Cada dimensión contiene una fila por clave. Las líneas de venta contienen las claves de referencia y las medidas cantidad e importe.</desc><text x="96" y="105" class="title">Esquema estrella</text><text x="96" y="155" class="sub">Las dimensiones describen; la tabla de hechos registra lo que se mide.</text>
<path d="M460 330H550V440H590 M1076 330H986V440H946 M460 710H550V600H590 M1076 710H986V600H946" class="line"/>
<rect x="590" y="330" width="356" height="400" rx="12" fill="#DCE6F1" stroke="#143254" stroke-width="4"/><text x="768" y="385" text-anchor="middle" class="label">HECHOS · VENTAS</text><text x="620" y="440" class="small">Una fila por línea</text><text x="620" y="480" class="small">de pedido</text><text x="620" y="545" class="small">Claves de dimensiones</text><text x="620" y="600" class="small">Cantidad</text><text x="620" y="645" class="small">Importe de venta</text>
<rect x="100" y="240" width="360" height="180" rx="12" fill="#FFFFFF" stroke="#143254" stroke-width="3"/><text x="124" y="284" class="label">FECHA</text><text x="124" y="336" class="small">Clave de fecha</text><text x="124" y="378" class="small">Día · mes · año</text><rect x="1076" y="240" width="360" height="180" rx="12" fill="#FFFFFF" stroke="#143254" stroke-width="3"/><text x="1100" y="284" class="label">CLIENTE</text><text x="1100" y="336" class="small">Clave de cliente</text><text x="1100" y="378" class="small">Nombre · segmento</text><rect x="100" y="620" width="360" height="180" rx="12" fill="#FFFFFF" stroke="#143254" stroke-width="3"/><text x="124" y="664" class="label">PRODUCTO</text><text x="124" y="716" class="small">Clave de producto</text><text x="124" y="758" class="small">Nombre · categoría</text><rect x="1076" y="620" width="360" height="180" rx="12" fill="#FFFFFF" stroke="#143254" stroke-width="3"/><text x="1100" y="664" class="label">SUCURSAL</text><text x="1100" y="716" class="small">Clave de sucursal</text><text x="1100" y="758" class="small">Ciudad · región</text><text x="480" y="315" class="label">1</text><text x="557" y="425" class="label">N</text><text x="1033" y="315" class="label">1</text><text x="954" y="425" class="label">N</text><text x="480" y="695" class="label">1</text><text x="557" y="590" class="label">N</text><text x="1033" y="695" class="label">1</text><text x="954" y="590" class="label">N</text><text x="96" y="890" class="label">1 → N: una fila de dimensión puede describir muchas filas de hechos.</text><text x="96" y="940" class="small">Comprobá claves únicas en las dimensiones y referencias válidas en la tabla de hechos.</text></svg>