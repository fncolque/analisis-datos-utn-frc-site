<text x="52.0" y="118.0" fill="#151616" font-family="'Segoe UI', Arial, sans-serif" font-size="34" font-weight="850" text-anchor="start">¿Qué función cumple cada parte del código y cómo se conectan entre sí?</text>
<rect x="52" y="190" width="700" height="1028" rx="20" fill="#143254"/>
<text x="82.0" y="234.0" fill="#ffff33" font-family="'Segoe UI', Arial, sans-serif" font-size="18" font-weight="850" text-anchor="start" letter-spacing="1">UN PROGRAMA BREVE, LÍNEA POR LÍNEA</text>
<text x="86.0" y="282.0" fill="#9bb3c9" font-family="Consolas, monospace" font-size="18" font-weight="700" text-anchor="end">01</text>
<text x="108.0" y="282.0" fill="#ffffff" font-family="Consolas, monospace" font-size="21" font-weight="600" text-anchor="start">import pandas as pd</text>
<text x="86.0" y="325.0" fill="#9bb3c9" font-family="Consolas, monospace" font-size="18" font-weight="700" text-anchor="end">02</text>
<text x="108.0" y="325.0" fill="#ffffff" font-family="Consolas, monospace" font-size="21" font-weight="600" text-anchor="start">margenes = [0.24, 0.18, 0.31]</text>
<text x="86.0" y="368.0" fill="#9bb3c9" font-family="Consolas, monospace" font-size="18" font-weight="700" text-anchor="end">03</text>
<text x="108.0" y="368.0" fill="#ffffff" font-family="Consolas, monospace" font-size="21" font-weight="600" text-anchor="start">def clasificar(valor):</text>
<text x="86.0" y="411.0" fill="#9bb3c9" font-family="Consolas, monospace" font-size="18" font-weight="700" text-anchor="end">04</text>
<text x="108.0" y="411.0" fill="#ffffff" font-family="Consolas, monospace" font-size="21" font-weight="600" text-anchor="start">    if valor &lt; 0.20:</text>
<text x="86.0" y="454.0" fill="#9bb3c9" font-family="Consolas, monospace" font-size="18" font-weight="700" text-anchor="end">05</text>
<text x="108.0" y="454.0" fill="#ffffff" font-family="Consolas, monospace" font-size="21" font-weight="600" text-anchor="start">        return &#x27;revisar&#x27;</text>
<text x="86.0" y="497.0" fill="#9bb3c9" font-family="Consolas, monospace" font-size="18" font-weight="700" text-anchor="end">06</text>
<text x="108.0" y="497.0" fill="#ffffff" font-family="Consolas, monospace" font-size="21" font-weight="600" text-anchor="start">    return &#x27;ok&#x27;</text>
<text x="86.0" y="540.0" fill="#9bb3c9" font-family="Consolas, monospace" font-size="18" font-weight="700" text-anchor="end">07</text>
<text x="108.0" y="540.0" fill="#ffffff" font-family="Consolas, monospace" font-size="21" font-weight="600" text-anchor="start">for margen in margenes:</text>
<text x="86.0" y="583.0" fill="#9bb3c9" font-family="Consolas, monospace" font-size="18" font-weight="700" text-anchor="end">08</text>
<text x="108.0" y="583.0" fill="#ffffff" font-family="Consolas, monospace" font-size="21" font-weight="600" text-anchor="start">    estado = clasificar(margen)</text>
<text x="86.0" y="626.0" fill="#9bb3c9" font-family="Consolas, monospace" font-size="18" font-weight="700" text-anchor="end">09</text>
<text x="108.0" y="626.0" fill="#ffffff" font-family="Consolas, monospace" font-size="21" font-weight="600" text-anchor="start">    print(estado)</text>
<text x="86.0" y="669.0" fill="#9bb3c9" font-family="Consolas, monospace" font-size="18" font-weight="700" text-anchor="end">10</text>
<text x="108.0" y="669.0" fill="#ffffff" font-family="Consolas, monospace" font-size="21" font-weight="600" text-anchor="start">ventas = pd.DataFrame({&#x27;margen&#x27;: margenes})</text>
<text x="86.0" y="712.0" fill="#9bb3c9" font-family="Consolas, monospace" font-size="18" font-weight="700" text-anchor="end">11</text>
<text x="108.0" y="712.0" fill="#ffffff" font-family="Consolas, monospace" font-size="21" font-weight="600" text-anchor="start">ventas[&#x27;estado&#x27;] = ventas[&#x27;margen&#x27;].apply(clasificar)</text>
