<text x="52.0" y="118.0" fill="#151616" font-family="'Segoe UI', Arial, sans-serif" font-size="34" font-weight="850" text-anchor="start">¿Por qué una misma fórmula devuelve resultados distintos en cada visual?</text>
<rect x="52.0" y="190" width="734.0" height="58" rx="14" fill="#143254"/>
<text x="76.0" y="228.0" fill="#ffffff" font-family="'Segoe UI', Arial, sans-serif" font-size="24" font-weight="850" text-anchor="start">MEDIDA · SE EVALÚA AL CONSULTAR</text>
<g>
<rect class="card-bg" x="52.0" y="266.0" width="734.0" height="255.3" rx="18" fill="#ffffff" stroke="#9aabb9" stroke-width="2"/>
<rect x="52.0" y="266.0" width="10" height="255.3" rx="5" fill="#1f497d"/>
<rect x="80.0" y="288.0" width="165.0" height="34" rx="17" fill="#dce6f1"/>
<text x="94.0" y="312.0" fill="#143254" font-family="'Segoe UI', Arial, sans-serif" font-size="17" font-weight="800" text-anchor="start" letter-spacing="0.8">FILAS VISIBLES</text>
<text x="82.0" y="352.0" fill="#143254" font-family="'Segoe UI', Arial, sans-serif" font-size="26" font-weight="800" text-anchor="start">Contexto</text>
<text x="82.0" y="389.1" fill="#4b5966" font-family="'Segoe UI', Arial, sans-serif" font-size="20" font-weight="500" text-anchor="start">• Segmentadores de región y familia filtran dimensiones y</text>
<text x="82.0" y="413.5" fill="#4b5966" font-family="'Segoe UI', Arial, sans-serif" font-size="20" font-weight="500" text-anchor="start">hechos.</text>
<rect x="80.0" y="422.9" width="678.0" height="34" rx="5" fill="#143254"/>
<text x="92.0" y="445.9" fill="#ffffff" font-family="Consolas, 'Courier New', monospace" font-size="18" font-weight="600" text-anchor="start">[Ventas] = SUM(fact_ventas[importe])</text>
</g>
<g>
<rect class="card-bg" x="52.0" y="539.3" width="734.0" height="255.3" rx="18" fill="#ffffff" stroke="#9aabb9" stroke-width="2"/>
<rect x="52.0" y="539.3" width="10" height="255.3" rx="5" fill="#1f497d"/>
<rect x="80.0" y="561.3" width="155.0" height="34" rx="17" fill="#dce6f1"/>
<text x="94.0" y="585.3" fill="#143254" font-family="'Segoe UI', Arial, sans-serif" font-size="17" font-weight="800" text-anchor="start" letter-spacing="0.8">MISMA FÓRMULA</text>
<text x="82.0" y="625.3" fill="#143254" font-family="'Segoe UI', Arial, sans-serif" font-size="26" font-weight="800" text-anchor="start">Tres consultas</text>
<text x="82.0" y="662.4" fill="#4b5966" font-family="'Segoe UI', Arial, sans-serif" font-size="20" font-weight="500" text-anchor="start">• Sin filtro → total general</text>
<text x="82.0" y="691.8" fill="#4b5966" font-family="'Segoe UI', Arial, sans-serif" font-size="20" font-weight="500" text-anchor="start">• Región = Patagonia → subtotal</text>
<text x="82.0" y="721.2" fill="#4b5966" font-family="'Segoe UI', Arial, sans-serif" font-size="20" font-weight="500" text-anchor="start">• Familia = Bombas → subtotal</text>
<rect x="80.0" y="721.7" width="204.0" height="32" rx="4" fill="#ffff33"/>
<text x="92.0" y="743.7" fill="#151616" font-family="'Segoe UI', Arial, sans-serif" font-size="15" font-weight="850" text-anchor="start">resultado distinto</text>
</g>
<g>
<rect class="card-bg" x="52.0" y="812.7" width="734.0" height="255.3" rx="18" fill="#ffffff" stroke="#9aabb9" stroke-width="2"/>
<rect x="52.0" y="812.7" width="10" height="255.3" rx="5" fill="#1f497d"/>
<rect x="80.0" y="834.7" width="205.0" height="34" rx="17" fill="#dce6f1"/>
<text x="94.0" y="858.7" fill="#143254" font-family="'Segoe UI', Arial, sans-serif" font-size="15" font-weight="800" text-anchor="start" letter-spacing="0.8">CONTEXTO COMBINADO</text>
<text x="82.0" y="898.7" fill="#143254" font-family="'Segoe UI', Arial, sans-serif" font-size="26" font-weight="800" text-anchor="start">Intersección</text>
<text x="82.0" y="935.7" fill="#4b5966" font-family="'Segoe UI', Arial, sans-serif" font-size="20" font-weight="500" text-anchor="start">• Patagonia + Bombas conserva solo filas que cumplen ambos</text>
<text x="82.0" y="960.1" fill="#4b5966" font-family="'Segoe UI', Arial, sans-serif" font-size="20" font-weight="500" text-anchor="start">filtros.</text>
</g>
<rect x="814.0" y="190" width="734.0" height="58" rx="14" fill="#143254"/>
<text x="838.0" y="228.0" fill="#ffffff" font-family="'Segoe UI', Arial, sans-serif" font-size="24" font-weight="850" text-anchor="start">COLUMNA CALCULADA · SE ALMACENA POR FILA</text>
<g>
<rect class="card-bg" x="814.0" y="266.0" width="734.0" height="255.3" rx="18" fill="#ffffff" stroke="#9aabb9" stroke-width="2"/>
<rect x="814.0" y="266.0" width="10" height="255.3" rx="5" fill="#1f497d"/>
<rect x="842.0" y="288.0" width="155.0" height="34" rx="17" fill="#dce6f1"/>
<text x="856.0" y="312.0" fill="#143254" font-family="'Segoe UI', Arial, sans-serif" font-size="17" font-weight="800" text-anchor="start" letter-spacing="0.8">ACTUALIZACIÓN</text>
<text x="844.0" y="352.0" fill="#143254" font-family="'Segoe UI', Arial, sans-serif" font-size="26" font-weight="800" text-anchor="start">Cálculo</text>
<text x="844.0" y="389.1" fill="#4b5966" font-family="'Segoe UI', Arial, sans-serif" font-size="20" font-weight="500" text-anchor="start">• importe = cantidad × precio</text>
<rect x="842.0" y="398.5" width="678.0" height="34" rx="5" fill="#143254"/>
<text x="854.0" y="421.5" fill="#ffffff" font-family="Consolas, 'Courier New', monospace" font-size="18" font-weight="600" text-anchor="start">fact_ventas[importe]</text>
</g>
<g>
<rect class="card-bg" x="814.0" y="539.3" width="734.0" height="255.3" rx="18" fill="#ffffff" stroke="#9aabb9" stroke-width="2"/>
<rect x="814.0" y="539.3" width="10" height="255.3" rx="5" fill="#1f497d"/>
<rect x="842.0" y="561.3" width="165.0" height="34" rx="17" fill="#dce6f1"/>
<text x="856.0" y="585.3" fill="#143254" font-family="'Segoe UI', Arial, sans-serif" font-size="17" font-weight="800" text-anchor="start" letter-spacing="0.8">GRANO DE HECHO</text>
<text x="844.0" y="625.3" fill="#143254" font-family="'Segoe UI', Arial, sans-serif" font-size="26" font-weight="800" text-anchor="start">Persistencia</text>
<text x="844.0" y="662.4" fill="#4b5966" font-family="'Segoe UI', Arial, sans-serif" font-size="20" font-weight="500" text-anchor="start">• Cada fila conserva su resultado hasta la próxima</text>
<text x="844.0" y="686.8" fill="#4b5966" font-family="'Segoe UI', Arial, sans-serif" font-size="20" font-weight="500" text-anchor="start">actualización.</text>
</g>
<g>
<rect class="card-bg" x="814.0" y="812.7" width="734.0" height="255.3" rx="18" fill="#ffffff" stroke="#9aabb9" stroke-width="2"/>
<rect x="814.0" y="812.7" width="10" height="255.3" rx="5" fill="#1f497d"/>
<rect x="842.0" y="834.7" width="105.0" height="34" rx="17" fill="#dce6f1"/>
<text x="856.0" y="858.7" fill="#143254" font-family="'Segoe UI', Arial, sans-serif" font-size="17" font-weight="800" text-anchor="start" letter-spacing="0.8">CONSULTA</text>
<text x="844.0" y="898.7" fill="#143254" font-family="'Segoe UI', Arial, sans-serif" font-size="26" font-weight="800" text-anchor="start">Uso</text>
<text x="844.0" y="935.7" fill="#4b5966" font-family="'Segoe UI', Arial, sans-serif" font-size="20" font-weight="500" text-anchor="start">• La medida agrega la columna dentro del contexto actual.</text>
<rect x="842.0" y="995.0" width="274.0" height="32" rx="4" fill="#ffff33"/>
<text x="854.0" y="1017.0" fill="#151616" font-family="'Segoe UI', Arial, sans-serif" font-size="15" font-weight="850" text-anchor="start">columna → medida → visual</text>
</g>
