<title id="title">De una decisión a un KPI que puede auditarse</title>
<desc id="desc">Seis etapas conectan una decisión sobre descuentos con responsable, alternativas, fórmula de margen, grano, período, población, fuentes, controles, umbral, acción y retorno de aprendizaje.</desc>
