<text x="1007.3" y="231.0" fill="#151616" font-family="'Segoe UI', Arial, sans-serif" font-size="16" font-weight="900" text-anchor="middle">02</text>
<text x="588.7" y="276.0" fill="#143254" font-family="'Segoe UI', Arial, sans-serif" font-size="26" font-weight="800" text-anchor="start">KPI y fórmula</text>
<text x="588.7" y="313.1" fill="#4b5966" font-family="'Segoe UI', Arial, sans-serif" font-size="20" font-weight="500" text-anchor="start">• Margen % = (ventas − costo) / ventas.</text>
<text x="588.7" y="342.5" fill="#4b5966" font-family="'Segoe UI', Arial, sans-serif" font-size="20" font-weight="500" text-anchor="start">• Pregunta: ¿qué familia pierde margen?</text>
<rect x="586.7" y="351.9" width="426.7" height="34" rx="5" fill="#143254"/>
<text x="598.7" y="374.9" fill="#ffffff" font-family="Consolas, 'Courier New', monospace" font-size="18" font-weight="600" text-anchor="start">margen_pct = (ventas - costo) / ventas</text>
</g>
