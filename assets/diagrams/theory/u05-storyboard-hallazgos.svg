<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" role="img" aria-labelledby="title desc">
<title id="title">Un storyboard que puede comprenderse leyendo los títulos</title>
<desc id="desc">Cinco escenas de Faro Sur conectan decisión, contexto, tensión, evidencia, recomendación y límite; cada una declara pregunta, evidencia y un título redactado como hallazgo, con análisis secundarios en respaldo.</desc>
<defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#9aabb9" stroke-width="1" opacity=".32"/></pattern><marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0,0 L12,6 L0,12 z" fill="#1f497d"/></marker></defs>
<style>.atlas-step{outline:none;cursor:pointer}.atlas-step .card-bg{transition:stroke .16s ease,filter .16s ease}.atlas-step:hover .card-bg,.atlas-step:focus .card-bg{stroke:#ffff33;stroke-width:7px}</style>
<rect x="0" y="0" width="1600" height="1100" fill="#f7f2e8"/>
<image href="../../images/generated/u05-story-evidence.webp" x="0" y="0" width="1600" height="1100" opacity="0.055" preserveAspectRatio="xMidYMid slice"/>
<rect x="0" y="0" width="1600" height="1100" fill="url(#grid)" opacity=".36"/>
<rect x="52" y="38" width="250" height="42" rx="21" fill="#143254"/>
<text x="177.0" y="66.0" fill="#ffffff" font-family="'Segoe UI', Arial, sans-serif" font-size="17" font-weight="850" text-anchor="middle" letter-spacing="1">ATLAS TEÓRICO · C12</text>
<text x="52.0" y="118.0" fill="#151616" font-family="'Segoe UI', Arial, sans-serif" font-size="34" font-weight="850" text-anchor="start">¿Qué debe aportar cada escena para conducir desde la decisión hasta una</text>
<text x="52.0" y="153.7" fill="#151616" font-family="'Segoe UI', Arial, sans-serif" font-size="34" font-weight="850" text-anchor="start">recomendación acotada?</text>
<g class="atlas-step" data-step="1" tabindex="0" role="group" aria-label="Paso 1: Revisaremos descuentos por familia">
<rect class="card-bg" x="52.0" y="190.0" width="280.0" height="828.0" rx="18" fill="#ffffff" stroke="#9aabb9" stroke-width="2"/>
<rect x="52.0" y="190.0" width="10" height="828.0" rx="5" fill="#1f497d"/>
<rect x="80.0" y="212.0" width="155.0" height="34" rx="17" fill="#dce6f1"/>
<text x="94.0" y="236.0" fill="#143254" font-family="'Segoe UI', Arial, sans-serif" font-size="17" font-weight="800" text-anchor="start" letter-spacing="0.8">01 · DECISIÓN</text>
<circle cx="298.0" cy="224.0" r="19" fill="#ffff33" stroke="#143254" stroke-width="2"/>
<text x="298.0" y="231.0" fill="#151616" font-family="'Segoe UI', Arial, sans-serif" font-size="16" font-weight="900" text-anchor="middle">01</text>
<text x="82.0" y="276.0" fill="#143254" font-family="'Segoe UI', Arial, sans-serif" font-size="26" font-weight="800" text-anchor="start">Revisaremos</text>
<text x="82.0" y="304.1" fill="#143254" font-family="'Segoe UI', Arial, sans-serif" font-size="26" font-weight="800" text-anchor="start">descuentos por</text>
<text x="82.0" y="341.2" fill="#4b5966" font-family="'Segoe UI', Arial, sans-serif" font-size="20" font-weight="500" text-anchor="start">• Pregunta: ¿qué</text>
<text x="82.0" y="365.6" fill="#4b5966" font-family="'Segoe UI', Arial, sans-serif" font-size="20" font-weight="500" text-anchor="start">decisión debe tomar</text>
<text x="82.0" y="390.0" fill="#4b5966" font-family="'Segoe UI', Arial, sans-serif" font-size="20" font-weight="500" text-anchor="start">Comercial?</text>
</g>
<path d="M336.0,604.0 L351.0,604.0" fill="none" stroke="#1f497d" stroke-width="4" marker-end="url(#arrow)"/>
<g class="atlas-step" data-step="2" tabindex="0" role="group" aria-label="Paso 2: El margen promedio oculta diferencias">
<rect class="card-bg" x="356.0" y="190.0" width="280.0" height="828.0" rx="18" fill="#ffffff" stroke="#9aabb9" stroke-width="2"/>
<rect x="356.0" y="190.0" width="10" height="828.0" rx="5" fill="#1f497d"/>
<rect x="384.0" y="212.0" width="155.0" height="34" rx="17" fill="#dce6f1"/>
<text x="398.0" y="236.0" fill="#143254" font-family="'Segoe UI', Arial, sans-serif" font-size="17" font-weight="800" text-anchor="start" letter-spacing="0.8">02 · CONTEXTO</text>
<circle cx="602.0" cy="224.0" r="19" fill="#ffff33" stroke="#143254" stroke-width="2"/>
<text x="602.0" y="231.0" fill="#151616" font-family="'Segoe UI', Arial, sans-serif" font-size="16" font-weight="900" text-anchor="middle">02</text>
<text x="386.0" y="276.0" fill="#143254" font-family="'Segoe UI', Arial, sans-serif" font-size="26" font-weight="800" text-anchor="start">El margen</text>
<text x="386.0" y="304.1" fill="#143254" font-family="'Segoe UI', Arial, sans-serif" font-size="26" font-weight="800" text-anchor="start">promedio oculta</text>
<text x="386.0" y="341.2" fill="#4b5966" font-family="'Segoe UI', Arial, sans-serif" font-size="20" font-weight="500" text-anchor="start">• Evidencia:</text>
<text x="386.0" y="365.6" fill="#4b5966" font-family="'Segoe UI', Arial, sans-serif" font-size="20" font-weight="500" text-anchor="start">período, cobertura y</text>
<text x="386.0" y="390.0" fill="#4b5966" font-family="'Segoe UI', Arial, sans-serif" font-size="20" font-weight="500" text-anchor="start">punto de referencia.</text>
</g>
<path d="M640.0,604.0 L655.0,604.0" fill="none" stroke="#1f497d" stroke-width="4" marker-end="url(#arrow)"/>
<g class="atlas-step" data-step="3" tabindex="0" role="group" aria-label="Paso 3: Bombas concentra la caída observada">
<rect class="card-bg" x="660.0" y="190.0" width="280.0" height="828.0" rx="18" fill="#ffffff" stroke="#9aabb9" stroke-width="2"/>
<rect x="660.0" y="190.0" width="10" height="828.0" rx="5" fill="#1f497d"/>
<rect x="688.0" y="212.0" width="145.0" height="34" rx="17" fill="#dce6f1"/>
<text x="702.0" y="236.0" fill="#143254" font-family="'Segoe UI', Arial, sans-serif" font-size="17" font-weight="800" text-anchor="start" letter-spacing="0.8">03 · TENSIÓN</text>
<circle cx="906.0" cy="224.0" r="19" fill="#ffff33" stroke="#143254" stroke-width="2"/>
<text x="906.0" y="231.0" fill="#151616" font-family="'Segoe UI', Arial, sans-serif" font-size="16" font-weight="900" text-anchor="middle">03</text>
<text x="690.0" y="276.0" fill="#143254" font-family="'Segoe UI', Arial, sans-serif" font-size="26" font-weight="800" text-anchor="start">Bombas</text>
<text x="690.0" y="304.1" fill="#143254" font-family="'Segoe UI', Arial, sans-serif" font-size="26" font-weight="800" text-anchor="start">concentra la</text>
<text x="690.0" y="341.2" fill="#4b5966" font-family="'Segoe UI', Arial, sans-serif" font-size="20" font-weight="500" text-anchor="start">• Evidencia:</text>
<text x="690.0" y="365.6" fill="#4b5966" font-family="'Segoe UI', Arial, sans-serif" font-size="20" font-weight="500" text-anchor="start">comparación por</text>
<text x="690.0" y="390.0" fill="#4b5966" font-family="'Segoe UI', Arial, sans-serif" font-size="20" font-weight="500" text-anchor="start">familia y volumen.</text>
</g>
<path d="M944.0,604.0 L959.0,604.0" fill="none" stroke="#1f497d" stroke-width="4" marker-end="url(#arrow)"/>
<g class="atlas-step" data-step="4" tabindex="0" role="group" aria-label="Paso 4: El descuento explica parte de la brecha">
<rect class="card-bg" x="964.0" y="190.0" width="280.0" height="828.0" rx="18" fill="#ffffff" stroke="#9aabb9" stroke-width="2"/>
<rect x="964.0" y="190.0" width="10" height="828.0" rx="5" fill="#1f497d"/>
<rect x="992.0" y="212.0" width="175.0" height="34" rx="17" fill="#dce6f1"/>
<text x="1006.0" y="236.0" fill="#143254" font-family="'Segoe UI', Arial, sans-serif" font-size="15" font-weight="800" text-anchor="start" letter-spacing="0.8">04 · EXPLICACIÓN</text>
<circle cx="1210.0" cy="224.0" r="19" fill="#ffff33" stroke="#143254" stroke-width="2"/>
<text x="1210.0" y="231.0" fill="#151616" font-family="'Segoe UI', Arial, sans-serif" font-size="16" font-weight="900" text-anchor="middle">04</text>
<text x="994.0" y="276.0" fill="#143254" font-family="'Segoe UI', Arial, sans-serif" font-size="26" font-weight="800" text-anchor="start">El descuento</text>
<text x="994.0" y="304.1" fill="#143254" font-family="'Segoe UI', Arial, sans-serif" font-size="26" font-weight="800" text-anchor="start">explica parte</text>
<text x="994.0" y="341.2" fill="#4b5966" font-family="'Segoe UI', Arial, sans-serif" font-size="20" font-weight="500" text-anchor="start">• Evidencia:</text>
<text x="994.0" y="365.6" fill="#4b5966" font-family="'Segoe UI', Arial, sans-serif" font-size="20" font-weight="500" text-anchor="start">relación, casos y</text>
<text x="994.0" y="390.0" fill="#4b5966" font-family="'Segoe UI', Arial, sans-serif" font-size="20" font-weight="500" text-anchor="start">control de mezcla.</text>
</g>
<path d="M1248.0,604.0 L1263.0,604.0" fill="none" stroke="#1f497d" stroke-width="4" marker-end="url(#arrow)"/>
<g class="atlas-step" data-step="5" tabindex="0" role="group" aria-label="Paso 5: Probar un umbral y medir el resultado">
<rect class="card-bg" x="1268.0" y="190.0" width="280.0" height="828.0" rx="18" fill="#ffffff" stroke="#9aabb9" stroke-width="2"/>
<rect x="1268.0" y="190.0" width="10" height="828.0" rx="5" fill="#1f497d"/>
<rect x="1296.0" y="212.0" width="175.0" height="34" rx="17" fill="#dce6f1"/>
<text x="1310.0" y="236.0" fill="#143254" font-family="'Segoe UI', Arial, sans-serif" font-size="15" font-weight="800" text-anchor="start" letter-spacing="0.8">05 · RECOMENDACIÓN</text>
<circle cx="1514.0" cy="224.0" r="19" fill="#ffff33" stroke="#143254" stroke-width="2"/>
<text x="1514.0" y="231.0" fill="#151616" font-family="'Segoe UI', Arial, sans-serif" font-size="16" font-weight="900" text-anchor="middle">05</text>
<text x="1298.0" y="276.0" fill="#143254" font-family="'Segoe UI', Arial, sans-serif" font-size="26" font-weight="800" text-anchor="start">Probar un</text>
<text x="1298.0" y="304.1" fill="#143254" font-family="'Segoe UI', Arial, sans-serif" font-size="26" font-weight="800" text-anchor="start">umbral y medir</text>
<text x="1298.0" y="341.2" fill="#4b5966" font-family="'Segoe UI', Arial, sans-serif" font-size="20" font-weight="500" text-anchor="start">• Acción: piloto,</text>
<text x="1298.0" y="365.6" fill="#4b5966" font-family="'Segoe UI', Arial, sans-serif" font-size="20" font-weight="500" text-anchor="start">responsable y</text>
<text x="1298.0" y="390.0" fill="#4b5966" font-family="'Segoe UI', Arial, sans-serif" font-size="20" font-weight="500" text-anchor="start">métrica posterior.</text>
<text x="1298.0" y="419.4" fill="#4b5966" font-family="'Segoe UI', Arial, sans-serif" font-size="20" font-weight="500" text-anchor="start">• Límite: asociación</text>
<text x="1298.0" y="443.8" fill="#4b5966" font-family="'Segoe UI', Arial, sans-serif" font-size="20" font-weight="500" text-anchor="start">observada, no</text>
<text x="1298.0" y="468.2" fill="#4b5966" font-family="'Segoe UI', Arial, sans-serif" font-size="20" font-weight="500" text-anchor="start">causalidad</text>
<rect x="1296.0" y="945.0" width="224.0" height="32" rx="4" fill="#ffff33"/>
<text x="1308.0" y="967.0" fill="#151616" font-family="'Segoe UI', Arial, sans-serif" font-size="15" font-weight="850" text-anchor="start">respaldo: detalle y controles</text>
</g>
